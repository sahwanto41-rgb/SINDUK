<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Full bleed solid background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgm)" />
  
  <!-- Content scaled inside 80% safe zone (center 410px) -->
  <g transform="translate(256, 215) scale(1.35)">
    <!-- Shield / Badge Backing -->
    <path d="M 0,-60 L 50,-35 L 50,20 Q 50,65 0,85 Q -50,65 -50,20 L -50,-35 Z" fill="url(#goldm)" />
    <!-- School Building Motif inside shield -->
    <path d="M 0,-45 L 35,-25 L 35,-15 L -35,-15 L -35,-25 Z" fill="#0f172a" />
    <!-- Pillars -->
    <rect x="-28" y="-10" width="8" height="35" rx="2" fill="#0f172a" />
    <rect x="-10" y="-10" width="6" height="35" rx="1" fill="#0f172a" />
    <rect x="4" y="-10" width="6" height="35" rx="1" fill="#0f172a" />
    <rect x="20" y="-10" width="8" height="35" rx="2" fill="#0f172a" />
    <!-- Base -->
    <rect x="-35" y="27" width="70" height="8" rx="2" fill="#0f172a" />
    <!-- Star of Excellence -->
    <polygon points="0,42 4,50 12,50 6,55 8,64 0,58 -8,64 -6,55 -12,50 -4,50" fill="#0f172a" />
  </g>

  <!-- Title Banner inside safe area -->
  <text x="256" y="375" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="2">SI-DUK SMART</text>
  <text x="256" y="410" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1">SDN LANAS 1</text>
</svg>
