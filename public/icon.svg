<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Central Emblem: School & Civil Service Crest -->
  <g transform="translate(256, 210) scale(1.6)">
    <!-- Shield / Badge Backing -->
    <path d="M 0,-60 L 50,-35 L 50,20 Q 50,65 0,85 Q -50,65 -50,20 L -50,-35 Z" fill="url(#gold)" />
    <!-- School Building Motif inside shield -->
    <path d="M 0,-45 L 35,-25 L 35,-15 L -35,-15 L -35,-25 Z" fill="#0f172a" />
    <!-- Pillars -->
    <rect x="-28" y="-10" width="8" height="35" rx="2" fill="#0f172a" />
    <rect x="-10" y="-10" width="6" height="35" rx="1" fill="#0f172a" />
    <rect x="4" y="-10" width="6" height="35" rx="1" fill="#0f172a" />
    <rect x="20" y="-10" width="8" height="35" rx="2" fill="#0f172a" />
    <!-- Base -->
    <rect x="-35" y="27" width="70" height="8" rx="2" fill="#0f172a" />
    <!-- Star of Excellence -->
    <polygon points="0,42 4,50 12,50 6,55 8,64 0,58 -8,64 -6,55 -12,50 -4,50" fill="#0f172a" />
  </g>

  <!-- Title Banner -->
  <text x="256" y="395" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="2">SI-DUK SMART</text>
  <text x="256" y="435" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="1">SDN LANAS 1 BOTOLINGGO</text>
</svg>
